<script type="text/plain" id="sqlsrc">-- # December With Jesus - setup
-- 1. Supabase: new project > Auth > enable **Anonymous sign-ins**.
-- 2. SQL editor: run `schema_and_seed.sql`.
-- 3. In index.html set `SB_URL` and `SB_KEY` (anon public key ONLY, never service-role). Empty = local demo mode (browser storage, not secure/permanent).
-- 4. Deploy index.html to any static host (Netlify/Vercel/GitHub Pages).
-- 5. Tests: open ornament 5 -> gift; click 5 again -> "already received"; Gift Bank shows same text/date; refresh -> unchanged; double-click fast -> 1 row (UNIQUE(visitor_id, ornament_id)).
-- ## Flags in your Excel
-- - Only 20 themes, 5 verses each (theme 20 has 4 and is titled "مواضيع مختلفة" - rename it). Verses 21-31 are my additions (1-2 each): please verify.
-- - Fixed: missing opening « (theme 3 verse 2, theme 20 verse 1) and a stray "27." prefix.
-- - Messages/reflections/prayers are NOT in the file: I used 3 draft templates each - replace with approved Egyptian Arabic text.
-- - Anonymous accounts are lost if browser data is cleared unless a login is linked (not built yet).

-- DECEMBER WITH JESUS - Supabase schema. Run in SQL editor, then enable Auth > Anonymous sign-ins.
create table ornaments(id int primary key,n int unique not null check(n between 1 and 31),title_en text,title_ar text,is_active bool default true,created_at timestamptz default now());
create table bible_verses(id serial primary key,ornament_id int references ornaments,verse_text text not null,bible_reference text not null,language text default 'ar',translation text default 'as supplied',content_version int default 1,is_active bool default true);
create table message_variations(id serial primary key,ornament_id int references ornaments,message_text text not null,language text default 'ar',content_version int default 1,is_active bool default true);
create table reflections(id serial primary key,ornament_id int references ornaments,reflection_text text not null,language text default 'ar',content_version int default 1,is_active bool default true);
create table prayers(id serial primary key,ornament_id int references ornaments,prayer_text text not null,language text default 'ar',content_version int default 1,is_active bool default true);
create table visitors(id uuid primary key,created_at timestamptz default now(),updated_at timestamptz default now(),preferences jsonb default '{}');
create table visitor_ornament_assignments(
 id bigserial primary key,visitor_id uuid not null references visitors(id),ornament_id int not null references ornaments(id),
 bible_verse_id int,message_id int,reflection_id int,prayer_id int,
 saved_verse_text text not null,saved_bible_reference text not null,saved_message_text text not null,saved_reflection_text text not null,saved_prayer_text text not null,
 content_snapshot jsonb not null,received_at timestamptz not null default now(),created_at timestamptz default now(),
 unique(visitor_id,ornament_id));
-- progress is DERIVED from assignments (no separate counter table to trust)
alter table ornaments enable row level security;alter table bible_verses enable row level security;alter table message_variations enable row level security;
alter table reflections enable row level security;alter table prayers enable row level security;
alter table visitors enable row level security;alter table visitor_ornament_assignments enable row level security;
create policy own_visitor on visitors for select using(id=auth.uid());
create policy own_gifts on visitor_ornament_assignments for select using(visitor_id=auth.uid());
-- no insert/update/delete policies: clients can only write through the RPCs below.
revoke all on all tables in schema public from anon,authenticated;
grant select on visitors,visitor_ornament_assignments to authenticated;

create function register_anonymous_visitor() returns uuid language plpgsql security definer set search_path=public as $$
begin if auth.uid() is null then raise exception 'AUTH_REQUIRED';end if;
insert into visitors(id) values(auth.uid()) on conflict do nothing;return auth.uid();end$$;

create function open_ornament_once(p_number int) returns jsonb language plpgsql security definer set search_path=public as $$
declare u uuid:=auth.uid();o ornaments;v bible_verses;m message_variations;r reflections;p prayers;snap jsonb;a visitor_ornament_assignments;
begin
 if u is null then raise exception 'AUTH_REQUIRED';end if;
 select * into o from ornaments where n=p_number and is_active;
 if not found then raise exception 'INVALID_ORNAMENT';end if;
 insert into visitors(id) values(u) on conflict do nothing;
 if exists(select 1 from visitor_ornament_assignments where visitor_id=u and ornament_id=o.id) then return jsonb_build_object('status','ALREADY_RECEIVED');end if;
 select * into v from bible_verses where ornament_id=o.id and is_active order by random() limit 1;
 select * into m from message_variations where ornament_id=o.id and is_active order by random() limit 1;
 select * into r from reflections where ornament_id=o.id and is_active order by random() limit 1;
 select * into p from prayers where ornament_id=o.id and is_active order by random() limit 1;
 if v.id is null or m.id is null or r.id is null or p.id is null then raise exception 'CONTENT_MISSING';end if;
 snap:=jsonb_build_object('n',o.n,'en',o.title_en,'ar',o.title_ar,'verse',v.verse_text,'ref',v.bible_reference,'msg',m.message_text,'refl',r.reflection_text,'prayer',p.prayer_text);
 insert into visitor_ornament_assignments(visitor_id,ornament_id,bible_verse_id,message_id,reflection_id,prayer_id,saved_verse_text,saved_bible_reference,saved_message_text,saved_reflection_text,saved_prayer_text,content_snapshot)
 values(u,o.id,v.id,m.id,r.id,p.id,v.verse_text,v.bible_reference,m.message_text,r.reflection_text,p.prayer_text,snap)
 on conflict(visitor_id,ornament_id) do nothing returning * into a;
 if a.id is null then return jsonb_build_object('status','ALREADY_RECEIVED');end if; -- lost a race
 return jsonb_build_object('status','OPENED','gift',a.content_snapshot||jsonb_build_object('at',a.received_at));
end$$;

create function get_gift_bank() returns jsonb language sql stable security definer set search_path=public as $$
 select coalesce(jsonb_agg(content_snapshot||jsonb_build_object('at',received_at) order by ornament_id),'[]') from visitor_ornament_assignments where visitor_id=auth.uid()$$;
create function get_gift_bank_item(p_number int) returns jsonb language sql stable security definer set search_path=public as $$
 select content_snapshot||jsonb_build_object('at',received_at) from visitor_ornament_assignments a join ornaments o on o.id=a.ornament_id where a.visitor_id=auth.uid() and o.n=p_number$$;
create function get_final_progress() returns jsonb language sql stable security definer set search_path=public as $$
 select jsonb_build_object('total_received',count(*),'total',31,'last_received_at',max(received_at)) from visitor_ornament_assignments where visitor_id=auth.uid()$$;
create function get_visitor_progress() returns jsonb language sql stable security definer set search_path=public as $$ select get_final_progress()$$;
create function get_available_ornaments() returns jsonb language sql stable security definer set search_path=public as $$
 select jsonb_agg(jsonb_build_object('n',o.n,'title',o.title_en,'status',case when a.id is null then 'AVAILABLE' else 'RECEIVED' end) order by o.n)
 from ornaments o left join visitor_ornament_assignments a on a.ornament_id=o.id and a.visitor_id=auth.uid() where o.is_active$$;
create function get_ornament_status(p_number int) returns text language sql stable security definer set search_path=public as $$
 select case when exists(select 1 from visitor_ornament_assignments a join ornaments o on o.id=a.ornament_id where a.visitor_id=auth.uid() and o.n=p_number) then 'RECEIVED' else 'AVAILABLE' end$$;
create function update_visitor_preferences(p jsonb) returns void language sql security definer set search_path=public as $$
 update visitors set preferences=p,updated_at=now() where id=auth.uid()$$;

insert into bible_verses(ornament_id,verse_text,bible_reference) values(18,'«اطلبوا السلام مع الجميع، والقداسة التي بدونها لن يرى أحد الرب»','عبرانيين ١٢:١٤');

const giftHTML=(g,fresh)=>`<div class="c"><p class="tag">DAY ${String(g.n).padStart(2,'0')} — ${g.en.toUpperCase()}</p><p class="ar c" style="text-align:center">${g.ar}</p><p class="sm">Received: ${fd(g.at)}</p></div>
<div class="card"><h4>GOD’S WORD</h4><p class="ar">${g.verse}<br><b>${g.ref}</b></p></div>
<div class="card"><h4>A PERSONAL MESSAGE</h4><p class="ar">${g.msg}</p></div>
<div class="card"><h4>A MOMENT TO REFLECT</h4><p class="ar">${g.refl}</p></div>
<div class="card"><h4>A LITTLE PRAYER</h4><p class="ar">${g.prayer}</p></div>
<div class="row">${fresh?'<button id="sv">SAVE IN MY GIFT BANK</button>':''}<button id="sh">SHARE THE LOVE</button><button class="ghost" id="x">${fresh?'BACK TO THE TREE':'BACK'}</button></div>`;
function showGift(g,fresh,back){ov(giftHTML(g,fresh));$('#x').onclick=back||cl;
if($('#sv'))$('#sv').onclick=()=>{$('#sv').textContent='✓ SAVED IN YOUR GIFT BANK';$('#sv').disabled=true};
$('#sh').onclick=async()=>{const t=`${g.verse} — ${g.ref}\n\nDecember With Jesus · Day ${g.n}`;try{navigator.share?await navigator.share({text:t}):(await navigator.clipboard.writeText(t),$('#sh').textContent='COPIED ✓')}catch(e){}}}
function showBank(sort='n'){const a=[...bank].sort((x,y)=>sort==='n'?x.n-y.n:new Date(y.at)-new Date(x.at)),got=new Set(a.map(g=>+g.n));
if(!a.length)return ov(`<div class="c"><h2 class="tag">MY GIFT BANK</h2><p class="ar c" style="text-align:center">لسه بنك الهدايا بتاعك فاضي... مستني أول هدية تستلمها؟</p><button id="x">START COLLECTING</button></div>`),$('#x').onclick=cl;
ov(`<div class="c"><h2 class="tag">‹ GIFT BANK ›</h2><p>YOUR PERSONAL COLLECTION</p><p class="ar c" style="text-align:center">كل هدية استلمتها... وكل كلمة فضلت معاك.</p><p class="prog">${a.length} / 31 GIFTS COLLECTED</p><div class="pb"><i style="width:${a.length/31*100}%"></i></div>
<div class="row"><select id="st"><option value="n">Sort: ornament number</option><option value="d">Sort: date received</option></select><button class="ghost" id="x">CLOSE</button></div></div>
<div class="grid">${a.map(g=>`<div class="card mini" data-n="${g.n}"><h4>DAY ${String(g.n).padStart(2,'0')} — ${g.en.toUpperCase()}</h4><p class="sm">✓ Received ${fd(g.at)}</p></div>`).join('')}</div>
<p class="sm c">Still available: ${[...Array(31)].map((_,i)=>i+1).filter(n=>!got.has(n)).join(', ')||'none — all collected!'}</p>`);
$('#st').value=sort;$('#st').onchange=e=>showBank(e.target.value);$('#x').onclick=cl;
document.querySelectorAll('.mini').forEach(el=>el.onclick=()=>showGift(bank.find(g=>g.n==el.dataset.n),false,()=>showBank(sort)))}
let busy=false;
async function openOrn(n){if(busy)return;busy=true;try{const r=await api.open(n);
if(r.status==='OPENED'){await refresh();showGift(r.gift,true)}
else ov(`<div class="c card"><h4>THIS GIFT HAS ALREADY BEEN RECEIVED.</h4><p class="ar c" style="text-align:center">الهدية دي وصلتك بالفعل... هتلاقيها محفوظة في بنك الهدايا بتاعك.</p><div class="row"><button id="gb">OPEN MY GIFT BANK</button><button class="ghost" id="x">CLOSE</button></div></div>`),$('#gb').onclick=()=>showBank(),$('#x').onclick=cl}
catch(e){ov(`<div class="c card"><p>Something went wrong. Nothing was saved — please try again.</p><button id="x">CLOSE</button></div>`);$('#x').onclick=cl}busy=false}
$('#tree').addEventListener('click',e=>{const g=e.target.closest('.orn');g&&openOrn(+g.dataset.n)});
$('#tree').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const g=e.target.closest('.orn');g&&openOrn(+g.dataset.n)}});
$('#bk').onclick=()=>showBank();
$('#hp').onclick=()=>{ov(`<div class="c card"><h4>ABOUT</h4><p>31 ornaments, all open from day one, in any order. Each one can be received once. Every gift is saved in MY GIFT BANK exactly as you received it.</p>${sb?'<p class="sm">Your account is anonymous: clearing browser data may lose it unless you link a login.</p>':'<p class="sm">LOCAL DEMO MODE: gifts live only in this browser. Not secure, permanent or cross-device. Connect Supabase for the real thing.</p>'}<div class="row"><button id="dv">SETUP &amp; SQL</button><button class="ghost" id="x">CLOSE</button></div></div>`);$('#x').onclick=cl;$('#dv').onclick=()=>{ov(`<div class="card"><h4>SETUP · SCHEMA · SEED · README</h4><p class="sm">Copy this into the Supabase SQL editor (README notes are SQL comments). Then set SB_URL and SB_KEY in this file.</p><textarea id="sq" readonly style="width:100%;height:55vh;background:#000a;color:#f3e3b3;border:1px solid #d4af3766;border-radius:10px;font:12px monospace;direction:ltr"></textarea><div class="row"><button id="cp">COPY ALL</button><button class="ghost" id="x">CLOSE</button></div></div>`);$('#sq').value=$('#sqlsrc').textContent.trim();$('#x').onclick=cl;$('#cp').onclick=async()=>{$('#sq').select();try{await navigator.clipboard.writeText($('#sq').value);$('#cp').textContent='COPIED ✓'}catch(e){document.execCommand('copy')}}}};
let ac,gn,os=[],on=false;
function music(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();gn=ac.createGain();gn.connect(ac.destination);[196,246.9,293.7].forEach(f=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.07;o.connect(g).connect(gn);o.start()});const H={D4:293.7,G4:392,A4:440,B4:493.9,D5:587.3,E5:659.3},S=[['D4',1],['G4',1.5],['G4',.5],['G4',1],['B4',1],['A4',1.5],['G4',.5],['A4',1],['B4',1],['G4',1.5],['G4',.5],['B4',1],['D5',1],['E5',3],['E5',1.5],['D5',.5],['D5',1],['B4',1],['B4',1.5],['G4',.5],['A4',1],['B4',.5],['A4',.5],['G4',3],[null,2]];let k=0;const step=()=>{if(!on){setTimeout(step,400);return}const[n,d]=S[k++%S.length];if(n){const t=ac.currentTime,f=H[n];[[f,.28],[f*2,.08]].forEach(([q,a])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=q;g.gain.setValueAtTime(a,t);g.gain.exponentialRampToValueAtTime(.001,t+d*.75+.6);o.connect(g).connect(gn);o.start(t);o.stop(t+d*.75+.7)})}setTimeout(step,d*750)};step()}
on=!on;on?ac.resume():ac.suspend();$('#mu').textContent=on?'♪':'🔇';setVol()}
const setVol=()=>{if(gn)gn.gain.value=$('#vol').value/100};
$('#vol').oninput=setVol;$('#mu').onclick=music;
$('#go').onclick=async()=>{$('#intro').hidden=true;$('#main').hidden=false;try{music()}catch(e){}await api.init().catch(()=>{});$('#demo').textContent=sb?'':'LOCAL DEMO MODE';await refresh()};
</script></body></html>
